    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Phase 6 PWA: register the app-shell service worker. Guarded to
      // http(s) so a single-file standalone build opened via file://
      // never registers (or throws) — registration lives only here.
      if (
        'serviceWorker' in navigator &&
        (location.protocol === 'https:' || location.protocol === 'http:')
      ) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
